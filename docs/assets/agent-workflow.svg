<text x="86" y="1053" font-size="18" font-weight="650" text-anchor="start" fill="#aa6421">归并任务结果的三类异常来源</text>
<text x="86" y="1083" font-size="16" font-weight="600" text-anchor="start" fill="#17334c">依赖失败 → skipped</text>
<text x="355" y="1083" font-size="15" font-weight="400" text-anchor="start" fill="#5c7185">后继任务被失败依赖阻断</text>
<text x="86" y="1110" font-size="16" font-weight="600" text-anchor="start" fill="#17334c">无可执行任务 → error</text>
<text x="355" y="1110" font-size="15" font-weight="400" text-anchor="start" fill="#5c7185">循环或缺失依赖</text>
<text x="86" y="1137" font-size="16" font-weight="600" text-anchor="start" fill="#17334c">任务异常 / 超时 → error</text>
<text x="355" y="1137" font-size="15" font-weight="400" text-anchor="start" fill="#5c7185">转换为结构化错误结果</text>
<rect x="724" y="1035" width="282" height="112" rx="12" fill="#e9f7f6" stroke="#addbd7"/>
<text x="748" y="1069" font-size="20" font-weight="650" text-anchor="start" fill="#17334c">归并任务结果</text>
<text x="748" y="1096" font-size="14" font-weight="400" text-anchor="start" fill="#5c7185">对应上方同名节点</text>
<text x="748" y="1118" font-size="14" font-weight="400" text-anchor="start" fill="#5c7185">统一进入后续观察与综合</text>
<path d="M676 1091 L724 1091" fill="none" stroke="#aa6421" stroke-width="2" stroke-linejoin="round" marker-end="url(#amber-arrow)"/>
<rect x="64" y="1185" width="1272" height="100" rx="12" fill="#eef4ff" stroke="#d2def0"/>
<text x="86" y="1214" font-size="17" font-weight="650" text-anchor="start" fill="#4267b2">工程边界</text>
<text x="86" y="1240" font-size="15" font-weight="400" text-anchor="start" fill="#5c7185">该工作流是进程内的有界任务调度，并不提供分布式队列或跨进程故障恢复；Planner / Observer / Synthesis 不是独立 LLM 调用。</text>
<text x="86" y="1263" font-size="15" font-weight="400" text-anchor="start" fill="#5c7185">Safety 分析可以给出待确认事项；真实写入仍通过 ActionDraft → 用户确认 → 权限校验 → GitHub 执行，详见系统地图。</text>
