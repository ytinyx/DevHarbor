name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      MILVUS_ENABLED: "false"
      AUTO_SYNC_ENABLED: "false"
      EMBEDDING_PROVIDER: deterministic
      EMBEDDING_MODEL: deterministic-demo
      EMBEDDING_DIMENSIONS: "128"
      RAG_LLM_ENABLED: "false"
      RAGAS_ENABLED: "false"
      LLM_API_KEY: ""
      GITHUB_TOKEN: ""
      RAGAS_JUDGE_API_KEY: ""
      EMBEDDING_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      RERANK_API_KEY: ""
      FEISHU_FEEDBACK_WEBHOOK_URL: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests
        run: python -m pytest app/tests -q -o asyncio_default_fixture_loop_scope=function

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
